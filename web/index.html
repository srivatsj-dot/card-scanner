<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Card-O-Rama · AI Trading Card Scanner & Value App (Pokémon & Sports)</title>
    <meta name="description" content="Free card scanner app: point your phone at any trading card to instantly see its value, hidden stats, condition grade, and smart trade ideas. Works for Pokémon, baseball, basketball, football, soccer, cricket & hockey cards." />
    <meta name="keywords" content="card scanner app, trading card scanner, card value app, scan trading card, pokemon card scanner, sports card scanner, card appraisal app, card price checker, baseball card scanner" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://cardorama.app/" />

    <!-- Social / ad link previews (Open Graph + Twitter). Drop a 1200×630
         og-image.png in web/public for the best preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Card-O-Rama" />
    <meta property="og:title" content="Card-O-Rama · AI Trading Card Scanner & Value App" />
    <meta property="og:description" content="Scan any card and instantly see its value, stats, condition, and smart trade ideas. Pokémon, baseball, basketball, football, soccer, cricket & hockey." />
    <meta property="og:url" content="https://cardorama.app/" />
    <meta property="og:image" content="https://cardorama.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Card-O-Rama — scan a trading card to see its value" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Card-O-Rama · AI Trading Card Scanner & Value App" />
    <meta name="twitter:description" content="Scan any card and instantly see its value, stats, condition, and smart trade ideas." />
    <meta name="twitter:image" content="https://cardorama.app/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c5cff" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Card-O-Rama" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Tells Google this is a free web app, for richer search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Card-O-Rama",
        "alternateName": "Card-O-Rama Card Scanner",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web, iOS, Android",
        "url": "https://cardorama.app/",
        "description": "AI trading card scanner and appraiser: scan any card for its value, stats, condition, and trade ideas across Pokémon, baseball, basketball, football, soccer, cricket, and hockey.",
        "featureList": [
          "Scan trading cards with your phone camera",
          "Instant card value and price estimates",
          "Condition grading and flaw detection",
          "Smart trade and trade-up suggestions",
          "Binder and wishlist tracking",
          "Supports Pokémon and sports cards"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Crawlable fallback: replaced by the React app on load, but gives
           search engines and no-JS visitors real, indexable content. -->
      <noscript>
        <h1>Card-O-Rama — AI Trading Card Scanner &amp; Value App</h1>
        <p>
          Card-O-Rama is a free card scanner app. Point your phone camera at any
          trading card and instantly see its estimated value, hidden stats,
          condition grade, and smart trade ideas. It works for Pokémon cards and
          sports cards — baseball, basketball, football, soccer, cricket and
          hockey — and lets you track your collection in a binder and wishlist.
        </p>
        <p>Enable JavaScript to start scanning cards.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
